[vfio-toggle]

# PCI address(es) of the GPU function(s) to manage, e.g. 0000:01:00.0. Run
# 'list-devices' to find them. Other members of the IOMMU group are handled
# according to group_expansion.
gpu_pci_ids = 0000:01:00.0

# Name of the VFIO driver to bind to. Leave as vfio-pci unless your hardware
# needs a vendor-supplied variant driver (its name is used both for
# driver_override and for loading the module).
# vfio_driver = vfio-pci

# auto: also move every non-bridge device sharing the IOMMU group (e.g. the
# GPU's HDMI audio). strict: refuse unless every such device is listed in
# gpu_pci_ids. Bridges are never touched.
# Choices: auto, strict
# group_expansion = auto

# What to do if a process still uses the GPU when 'bind' runs. abort: stop
# and list them. terminate: SIGTERM then SIGKILL them. ignore: continue
# anyway (the unbind may hang).
# Choices: abort, terminate, ignore
on_busy = terminate

# Seconds to wait for users of the GPU to exit on their own before on_busy
# applies.
# busy_wait_timeout = 10

# Extra device-node globs that count as 'using the GPU'. Needed for drivers
# whose nodes are not registered in sysfs. Set empty to disable.
# busy_extra_globs = /dev/nvidia* /dev/kfd

# systemd units (shell-style patterns) whose processes on_busy = terminate
# must never signal, because killing them would take the login/session
# infrastructure down with them.
# terminate_exclude_units = systemd-logind.service user@*.service

# Seconds between SIGTERM and SIGKILL when on_busy = terminate.
# kill_grace_period = 10

# Unbind the framebuffer console (vtconsole) if a managed GPU provides it,
# and rebind it on unbind/rollback.
# release_vt_console = True

# Unbind firmware framebuffer platform devices (efifb, simpledrm, ...) when
# a display-class GPU is managed; restored afterwards.
# release_platform_framebuffer = True

# Platform device names treated as firmware framebuffers.
# platform_framebuffer_globs = *framebuffer*

# Reset each device (via its sysfs 'reset' file, if any) while it is
# unbound, before handing it to vfio-pci.
# allow_function_level_reset = True

# If vfio-pci is not loaded, load it with the kernel's module helper. Set
# false if you load it at boot (modules-load.d).
# load_vfio_module = True

# Restore the pre-bind state automatically if 'bind' fails.
# auto_rollback = True

# Path to a single hook script, or directory containing hook scripts or
# <event>/ subdirectories.
# hook_dir = /etc/vfio-toggle/hooks.d

# Seconds a single hook may run.
# hook_timeout = 60

# Seconds a driver may take to finish one bind or unbind request before the
# tool reports a hang.
# driver_timeout = 60

# Seconds to wait for a driver to attach after a bind request.
# bind_settle_timeout = 10

# Log file (always DEBUG level). Rotated at log_max_bytes.
# log_file = /var/log/vfio-toggle.log

# Console log level.
# Choices: DEBUG, INFO, WARN, ERROR
# log_level = INFO

# Maximum size of the log file before it is rotated.
# log_max_bytes = 1048576

# Number of rotated log files to keep.
# log_backups = 1

# Where the pre-bind snapshot is stored (JSON).
# state_file = /var/lib/vfio-toggle/state.json

